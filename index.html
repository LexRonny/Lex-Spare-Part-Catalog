<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>LEX ROGERS // Universal Spare Part Catalog v1.0</title>
    <style>
        :root {
            --bg-dark: #181a1e;
            --panel-bg: #21252b;
            --border-gray: #3a3f4b;
            --accent-red: #9e2a2b;
            --holo-blue: #00f0ff;
            --holo-glow: rgba(0, 240, 255, 0.2);
            --text-main: #d0d5dc;
            --text-muted: #8b949e;
            --classified-gold: #e3b341;
            --status-blue: #00f0ff;
            --status-red: #ff3333;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            border: 1px solid var(--border-gray);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            padding: 15px;
            background: var(--panel-bg);
            text-align: center;
            margin-bottom: 15px;
            position: relative;
        }

        h1 {
            color: #f0f6fc;
            letter-spacing: 3px;
            margin: 0;
            font-size: 1.8rem;
        }

        .subtitle {
            color: var(--holo-blue);
            font-size: 0.75rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-gray);
            padding: 10px;
            text-align: center;
        }

        .stat-num {
            font-size: 1.3rem;
            color: var(--holo-blue);
            font-weight: bold;
        }

        .security-panel-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-light {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--status-blue);
            box-shadow: 0 0 8px var(--status-blue);
            display: inline-block;
            margin-right: 6px;
        }

        .status-light.restricted-active {
            background-color: var(--status-red);
            box-shadow: 0 0 8px var(--status-red);
        }

        .sec-btn {
            background: #161b22;
            border: 1px solid var(--classified-gold);
            color: var(--classified-gold);
            padding: 5px 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            font-size: 0.75rem;
        }
        .sec-btn:hover {
            background: var(--classified-gold);
            color: #000;
        }

        .control-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-gray);
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
        }

        .tabs-group, .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        button.tab-btn {
            background: #161b22;
            border: 1px solid var(--border-gray);
            color: var(--text-main);
            padding: 6px 10px;
            font-family: inherit;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        button.tab-btn.active, button.tab-btn:hover {
            border-color: var(--holo-blue);
            color: var(--holo-blue);
        }

        #mainCategoryButtons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 6px;
            width: 100%;
        }
        #mainCategoryButtons button.tab-btn {
            width: 100%;
            text-align: center;
            padding: 8px 6px;
            font-size: 0.7rem;
            box-sizing: border-box;
        }

        select, input[type="text"], textarea {
            background: #161b22;
            border: 1px solid var(--border-gray);
            color: var(--text-main);
            padding: 8px;
            font-family: inherit;
            font-size: 0.85rem;
        }

        input[type="text"] {
            flex: 1;
            min-width: 180px;
        }

        .category-folder {
            background: var(--panel-bg);
            border: 1px solid var(--border-gray);
            margin-bottom: 10px;
            padding: 10px;
        }

        .folder-header {
            color: var(--holo-blue);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
        }

        .folder-content {
            margin-top: 8px;
            padding-left: 12px;
            border-left: 2px solid var(--border-gray);
            display: none;
        }

        .folder-content.open {
            display: block;
        }

        .item-row {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .item-row.classified {
            border-color: var(--classified-gold);
            background: #1f1a0e;
        }

        .item-info {
            cursor: pointer;
            flex: 1;
        }

        .item-info:hover strong {
            color: var(--holo-blue);
            text-decoration: underline;
        }

        .item-info span {
            color: var(--holo-blue);
        }

        .universe-badge {
            font-size: 0.7rem;
            padding: 3px 7px;
            border: 1px solid var(--holo-blue);
            color: var(--holo-blue);
            cursor: pointer;
        }

        .universe-badge.classified {
            border-color: var(--classified-gold);
            color: var(--classified-gold);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--panel-bg);
            border: 2px solid var(--holo-blue);
            box-shadow: 0 0 25px var(--holo-glow);
            width: 90%;
            max-width: 750px;
            padding: 30px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            font-size: 1.05rem;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 6px 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        .modal-close:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .modal-header {
            border-bottom: 1px dashed var(--border-gray);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-title {
            color: #f0f6fc;
            font-size: 1.5rem;
            margin: 5px 0;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 0.95rem;
            margin-top: 15px;
            background: #161b22;
            padding: 12px;
            border: 1px solid var(--border-gray);
        }
    </style>
</head>
<body>

    <header>
        <h1>LEX ROGERS INDUSTRIAL CATALOGUE</h1>
        <div class="subtitle">// Galaktisk Masterarkiv & Shadow Hunter-register // AI Core: Spectre</div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-label">Katalogiserte Poster</div>
            <div class="stat-num" id="stat-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Sikkerhetsnivå</div>
            <div class="stat-num">
                <div class="security-panel-box">
                    <div>
                        <span class="status-light" id="statusIndicator"></span>
                        <span id="securityStatusText" style="color: var(--holo-blue); font-size: 0.8rem;">STANDARD (BLUE)</span>
                    </div>
                    <button class="sec-btn" onclick="toggleRestrictedFiles()">🔒 Toggle Restricted</button>
                </div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="row-group">
            <div class="tabs-group" id="universeTabs">
                <button class="tab-btn active" onclick="setUniverseFilter('All', this)">All Universes</button>
                <button class="tab-btn" onclick="setUniverseFilter('Canon', this)">Canon</button>
                <button class="tab-btn" onclick="setUniverseFilter('Legends', this)">Legends</button>
                <button class="tab-btn" onclick="setUniverseFilter('Fan-Made', this)">Fan-Made</button>
            </div>
            <div class="filter-group">
                <select id="manufacturerSelect">
                    <option value="All">All Manufacturers / Affiliations</option>
                </select>
                <input type="text" id="searchInput" placeholder="Search archive..." onkeyup="filterCatalog()">
                <button class="tab-btn" onclick="openAddModal()" style="border-color: var(--holo-blue); color: var(--holo-blue);">+ Legg til</button>
                <button class="tab-btn" onclick="exportBackup()" style="border-color: var(--classified-gold); color: var(--classified-gold);">💾 Eksporter Backup</button>
            </div>
        </div>

        <div id="mainCategoryButtons" style="border-top: 1px solid var(--border-gray); padding-top: 8px;">
        </div>

        <div class="row-group" id="subCategoryTabs" style="border-top: 1px dashed var(--border-gray); padding-top: 6px; display: none;">
        </div>
    </div>

    <div id="treeContainer"></div>

    <!-- VISNINGS- OG REDIGERINGS-MODAL -->
    <div class="modal-overlay" id="itemModal" onclick="closeModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">[ X ]</button>
            
            <div id="viewModeContainer">
                <div class="modal-header">
                    <div id="modal-id" style="color:var(--holo-blue); font-weight:bold; font-size: 1.1rem;"></div>
                    <div class="modal-title" id="modal-name"></div>
                    <div id="modal-universe" style="font-size:0.85rem; color:var(--text-muted);"></div>
                </div>
                
                <div id="modalDynamicContent"></div>

                <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                    <button class="tab-btn" onclick="deleteCurrentItem()" style="border-color: var(--accent-red); color: var(--accent-red);">Slett post</button>
                    <button class="tab-btn" onclick="switchToEditMode()" style="border-color: var(--holo-blue); color: var(--holo-blue);">Rediger post</button>
                </div>
				<!-- Miniatyrbilde som vises på datakortet -->
<div class="card-image-container" style="float: right; margin-left: 15px;">
    <img id="view-card-image" src="" alt="Bildeforspekting" style="width: 80px; height: 100px; object-fit: cover; cursor: pointer; border: 1px solid #00ffff; display: none;" onclick="openFullImage(this.src)" title="Klikk for å forstørre bilde">
</div>

<!-- Pop-up overlay for fullskjermvisning av bildet -->
<div id="imagePopupModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); text-align: center;" onclick="closeFullImage()">
    <span style="position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer;">&times;</span>
    <img id="fullImageElement" style="max-width: 90vw; max-height: 85vh; margin-top: 5vh; border: 2px solid #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.5);">
</div>
            </div>

            <!-- REDIGERINGSMODUS -->
            <div id="editModeContainer" style="display: none;">
                <h3 style="margin-top: 0; color: var(--holo-blue);">Rediger post</h3>
                
                <label style="font-size: 0.8rem; display: block; margin-top: 10px;">ID (Genereres automatisk eller låses):</label>
                <input type="text" id="edit-id" readonly style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: #111; color: var(--text-muted);">

                <label style="font-size: 0.8rem; display: block; margin-top: 10px;">Navn:</label>
                <input type="text" id="edit-name" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">

                <label style="font-size: 0.8rem; display: block; margin-top: 10px;">Univers Status:</label>
                <select id="edit-universe" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                    <option value="Canon">Canon</option>
                    <option value="Legends">Legends</option>
                    <option value="Fan-Made">Fan-Made</option>
                </select>

                <label style="font-size: 0.8rem; display: block; margin-top: 10px;">Hovedkategori:</label>
                <select id="edit-main-cat" onchange="updateSubCategoryDropdown('edit-main-cat', 'edit-sub-cat')" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;"></select>

                <label style="font-size: 0.8rem; display: block; margin-top: 10px;">Underkategori:</label>
                <select id="edit-sub-cat" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;"></select>

                <label style="font-size: 0.8rem; display: block; margin-top: 10px;">Produsent / Tilhørighet:</label>
                <input type="text" id="edit-manufacturer" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">

                <label style="font-size: 0.8rem; display: block; margin-top: 10px;">Beskrivelse / Biografi:</label>
                <textarea id="edit-desc" style="width: 100%; padding: 8px; margin-top: 4px; height: 60px; box-sizing: border-box;"></textarea>

                <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button class="tab-btn" onclick="cancelEditMode()">Avbryt</button>
                    <button class="tab-btn" onclick="saveEditedItem()" style="border-color: var(--holo-blue); color: var(--holo-blue);">Lagre endringer</button>
                </div>
            </div>

        </div>
    </div>
	<!-- NY "LEGG TIL"-MODAL OVERLAY -->
<div class="modal-overlay" id="addItemModal" onclick="closeAddModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()" style="max-width: 650px; max-height: 90vh; overflow-y: auto;">
        <button class="modal-close" onclick="closeAddModal()">[ X ]</button>
        
        <div class="modal-header">
            <div class="modal-title" style="color: var(--holo-blue);">Legg til ny post i katalogen</div>
        </div>

        <!-- DE 4 FANENE FOR LEGG TIL -->
        <div style="display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap;" id="addTabsContainer">
            <button type="button" class="tab-btn active" id="tabBtn1" onclick="switchAddTabNew(1)">1. Utstyr & Kamp</button>
            <button type="button" class="tab-btn" id="tabBtn2" onclick="switchAddTabNew(2)">2. Transport & Tech</button>
            <button type="button" class="tab-btn" id="tabBtn3" onclick="switchAddTabNew(3)">3. Forsyning & Industri</button>
            <button type="button" class="tab-btn" id="tabBtn4" onclick="switchAddTabNew(4)">4. Personell & Droider</button>
        </div>

        <!-- GLOBAL RESTRICTED-SJEKKBOKS -->
        <div style="background: rgba(255,200,0,0.1); border: 1px solid var(--classified-gold); padding: 6px 10px; margin-bottom: 15px; border-radius: 4px; font-size: 0.9rem;">
            <label style="color: var(--classified-gold); font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="global-pers-restricted" onchange="toggleRestrictedModalColor(this)"> 
                ⚠️ Legg i Restricted Files (The Shadows)
            </label>
        </div>

        <!-- ========================================== -->
        <!-- SKJEMA FOR FANE 1, 2 og 3 (GENERELT UTSTYR) -->
        <!-- ========================================== -->
        <div id="addItemGenericForm">
            <label style="font-size: 0.85rem; display: block; margin-top: 10px;">Navn på komponent / kjøretøy:</label>
            <input type="text" id="add-comp-name" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">

            <label style="font-size: 0.85rem; display: block; margin-top: 10px;">Univers Status:</label>
            <select id="add-comp-universe" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                <option value="Canon">Canon</option>
                <option value="Legends">Legends</option>
                <option value="Fan-Made">Fan-Made</option>
            </select>

            <label style="font-size: 0.85rem; display: block; margin-top: 10px;">Hovedkategori:</label>
            <select id="add-comp-main-cat" onchange="updateSubCategoryDropdown('add-comp-main-cat', 'add-comp-sub-cat')" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;"></select>

            <label style="font-size: 0.85rem; display: block; margin-top: 10px;">Underkategori:</label>
            <select id="add-comp-sub-cat" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;"></select>

            <label style="font-size: 0.85rem; display: block; margin-top: 10px;">Produsent:</label>
            <input type="text" id="add-comp-manufacturer" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;" placeholder="F.eks. Corellian Engineering Corporation">

            <label style="font-size: 0.85rem; display: block; margin-top: 10px;">Bilde-URL (GitHub Raw):</label>
            <input type="text" id="add-comp-image" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">

            <label style="font-size: 0.85rem; display: block; margin-top: 10px;">Kort beskrivelse:</label>
            <textarea id="add-comp-desc" style="width: 100%; padding: 8px; margin-top: 4px; height: 60px; box-sizing: border-box;"></textarea>
        </div>


        <!-- ========================================== -->
        <!-- SKJEMA FOR FANE 4 (PERSONELL & DROIDER)     -->
        <!-- ========================================== -->
        <div id="addItemPersonnelForm" style="display: none;">
            
            <!-- GRUNNLEGGENDE FELTER -->
            <div style="margin-bottom: 10px;">
                <label>Navn:</label>
                <input type="text" id="add-pers-name" style="width: 100%; padding: 6px; box-sizing: border-box;">
            </div>

            <label style="font-size: 0.85rem; display: block; margin-top: 10px;">Univers Status:</label>
            <select id="add-pers-universe" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                <option value="Canon">Canon</option>
                <option value="Legends">Legends</option>
                <option value="Fan-Made">Fan-Made</option>
            </select>

            <div style="display: flex; gap: 10px; margin-top: 10px; margin-bottom: 10px;">
                <div style="flex: 1;">
                    <label>Alder:</label>
                    <input type="number" id="add-pers-age" style="width: 100%; padding: 6px; box-sizing: border-box;" placeholder="F.eks. 21">
                </div>
                <div style="flex: 1;">
                    <label>Rase:</label>
                    <input type="text" id="add-pers-species" style="width: 100%; padding: 6px; box-sizing: border-box;" placeholder="Menneske, Twi'lek...">
                </div>
                <div style="flex: 1;">
                    <label>Kjønn:</label>
                    <input type="text" id="add-pers-gender" style="width: 100%; padding: 6px; box-sizing: border-box;" placeholder="Mann / Kvinne">
                </div>
            </div>

            <div style="margin-bottom: 10px;">
                <label>Tilhørighet / Fraksjon:</label>
                <input type="text" id="add-pers-faction" style="width: 100%; padding: 6px; box-sizing: border-box;" placeholder="Syndikat, nettverk...">
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div style="flex: 1;">
                    <label>Hovedkategori:</label>
                    <select id="add-pers-main-cat" style="width: 100%; padding: 6px; box-sizing: border-box;" onchange="updateSubCategoryDropdown('add-pers-main-cat', 'add-pers-sub-cat')"></select>
                </div>
                <div style="flex: 1;">
                    <label>Underkategori:</label>
                    <select id="add-pers-sub-cat" style="width: 100%; padding: 6px; box-sizing: border-box;"></select>
                </div>
            </div>

            <div style="margin-bottom: 10px;">
                <label>Bilde-URL (GitHub Raw):</label>
                <input type="text" id="add-pers-image" style="width: 100%; padding: 6px; box-sizing: border-box;" placeholder="https://raw.githubusercontent.com/...">
            </div>

            <!-- UTSEENDE OG KJENNETEGN -->
            <fieldset style="border: 1px solid var(--border-gray); padding: 10px; margin-bottom: 15px;">
                <legend style="color: var(--holo-blue); font-weight: bold;">Utseende / Kjennetegn</legend>
                
                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <div style="flex: 1;">
                        <label style="font-size: 0.85rem;">Kroppsbygning:</label>
                        <select id="add-pers-build" style="width: 100%; padding: 5px;">
                            <option value="">-- Velg bygg --</option>
                            <option value="Slim / Slender">Slim / Slender</option>
                            <option value="Thin / Skinny">Thin / Skinny</option>
                            <option value="Athletic / Muscular">Athletic / Muscular</option>
                            <option value="Well-built">Well-built</option>
                            <option value="Average build">Average build</option>
                            <option value="Stout / Plump">Stout / Plump</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size: 0.85rem;">Høyde:</label>
                        <select id="add-pers-height" style="width: 100%; padding: 5px;">
                            <option value="">-- Velg høyde --</option>
                            <option value="1.6m">1,6 m</option><option value="1.7m">1,7 m</option><option value="1.8m">1,8 m</option>
                            <option value="1.9m">1,9 m</option><option value="2.0m">2,0 m</option><option value="2.1m">2,1 m</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <div style="flex: 1;">
                        <label style="font-size: 0.85rem;">Hårfarge:</label>
                        <select id="add-pers-haircolor" style="width: 100%; padding: 5px;">
                            <option value="">-- Velg hårfarge --</option>
                            <option value="Blonde">Blonde</option>
                            <option value="Brown hair">Brown hair</option>
                            <option value="Brunette">Brunette</option>
                            <option value="Red hair">Red hair</option>
                            <option value="Black hair">Black hair</option>
                            <option value="Grey hair">Grey hair</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size: 0.85rem;">Hårlengde / Stil:</label>
                        <select id="add-pers-hairlength" style="width: 100%; padding: 5px;">
                            <option value="">-- Velg stil --</option>
                            <option value="Bald">Bald</option>
                            <option value="Short hair">Short hair</option>
                            <option value="Shoulder-length">Shoulder-length</option>
                            <option value="Long hair">Long hair</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label style="font-size: 0.85rem;">Beskrivelse (arr, tatoveringer):</label>
                    <textarea id="add-pers-appearance-desc" rows="2" style="width: 100%; padding: 5px; box-sizing: border-box;"></textarea>
                </div>

        function initCatalog() {
            let savedData = localStorage.getItem('lex_catalog_components');
            if (savedData) {
                try {
                    catalogData.components = JSON.parse(savedData);
                } catch(e) {
                    catalogData.components = [];
                }
            }

            // Duplikatkontroll og merking
            let idMap = new Map();
            let nameMap = new Map();

            catalogData.components.forEach(item => {
                let cleanId = item.id ? item.id.trim().toLowerCase() : '';
                let cleanName = item.name ? item.name.trim().toLowerCase() : '';

                if (cleanId && idMap.has(cleanId)) {
                    item.isDuplicate = true;
                } else if (cleanId) {
                    idMap.set(cleanId, item);
                }

                if (cleanName && nameMap.has(cleanName)) {
                    item.isDuplicate = true;
                } else if (cleanName) {
                    nameMap.set(cleanName, item);
                }
            });

            populateManufacturers();
            populateMainCategoryButtons();
            filterCatalog();
        }

        function saveToLocalStorage() {
            localStorage.setItem('lex_catalog_components', JSON.stringify(catalogData.components));
            initCatalog();
        }

        function exportBackup() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(catalogData, null, 4));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "catalogData_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
             alert("Sikkerhetskopi lastet ned!");
        }

        function toggleRestrictedFiles() {
            if (!unlockedClassified) {
                let pwd = prompt("Enter security clearance code for Restricted Archive (The Shadows):");
                if (pwd === "654321") {
                    unlockedClassified = true;
                    document.getElementById('statusIndicator').classList.add('restricted-active');
                    document.getElementById('securityStatusText').innerText = "RESTRICTED / ACTIVE (RED)";
                    document.getElementById('securityStatusText').style.color = "var(--status-red)";
                    alert("Access granted. The Shadows personnel, fleet and bases are now online.");
                    populateMainCategoryButtons();
                    filterCatalog();
                } else if (pwd !== null) {
                    alert("Access denied. Invalid code.");
                }
            } else {
                unlockedClassified = false;
                document.getElementById('statusIndicator').classList.remove('restricted-active');
                document.getElementById('securityStatusText').innerText = "STANDARD (BLUE)";
                document.getElementById('securityStatusText').style.color = "var(--holo-blue)";
                currentMainCategory = 'All';
                currentSubCategory = 'All';
                document.getElementById('subCategoryTabs').style.display = 'none';
                populateMainCategoryButtons();
                filterCatalog();
                alert("Restricted archive locked.");
            }
        }

        function populateManufacturers() {
            const select = document.getElementById('manufacturerSelect');
            select.innerHTML = '<option value="All">All Manufacturers / Affiliations</option>';
            let manufacturers = [...new Set(catalogData.components.map(p => p.manufacturing?.manufacturer).filter(Boolean))];
            manufacturers.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                select.appendChild(opt);
            });
            select.onchange = function() {
                if(this.value !== 'All' && MANUFACTURER_PROFILES[this.value]) {
                    showManufacturerPopup(this.value);
                }
                filterCatalog();
            }
        }

        function populateMainCategoryButtons() {
            const container = document.getElementById('mainCategoryButtons');
            let html = `<button class="tab-btn active" onclick="selectMainCategory('All', this)" style="grid-column: 1 / -1;">All Categories</button>`;

            let categoriesList = Object.keys(CATEGORY_STRUCTURE);

            categoriesList.forEach(cat => {
                let isRestrictedCat = (cat === 'The Shadows');
                if (isRestrictedCat) {
                    if (unlockedClassified) {
                        html += `<button class="tab-btn" onclick="selectMainCategory('${cat}', this)" style="color:var(--classified-gold); border-color:var(--classified-gold);">${cat}</button>`;
                    }
                } else {

        function selectMainCategory(catName, btn) {
            document.querySelectorAll('#mainCategoryButtons .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMainCategory = catName;
            currentSubCategory = 'All';

            if (catName === 'All') {
                document.getElementById('subCategoryTabs').style.display = 'none';
            } else {
                populateSubCategoryTabs(catName);
            }
            filterCatalog();
        }

        function populateSubCategoryTabs(mainCat) {
            const subContainer = document.getElementById('subCategoryTabs');
            subContainer.style.display = 'flex';

            let subCats = CATEGORY_STRUCTURE[mainCat] || [];

            let html = `<button class="tab-btn active" onclick="selectSubCategory('All', this)">All under ${mainCat}</button>`;
            subCats.forEach(sub => {
                html += `<button class="tab-btn" onclick="selectSubCategory('${sub}', this)">${sub}</button>`;
            });
            subContainer.innerHTML = html;
        }

        function selectSubCategory(subName, btn) {
            document.querySelectorAll('#subCategoryTabs .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSubCategory = subName;
            filterCatalog();
        }

        function setUniverseFilter(status, btn) {
            document.querySelectorAll('#universeTabs .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentUniverseFilter = status;
            filterCatalog();
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedManufacturer = document.getElementById('manufacturerSelect').value;

            const filtered = catalogData.components.filter(p => {
                let isRestricted = (p.universeStatus === 'Classified') || (p.categoryPath || '').startsWith('The Shadows');
                if (isRestricted && !unlockedClassified) return false;

                let matchesUniverse = currentUniverseFilter === 'All' || p.universeStatus === currentUniverseFilter;
                
                let matchesMain = currentMainCategory === 'All' || (p.categoryPath || '').toLowerCase().includes(currentMainCategory.toLowerCase());
                let matchesSub = currentSubCategory === 'All' || (p.categoryPath || '').toLowerCase().includes(currentSubCategory.toLowerCase());
                let matchesManufacturer = selectedManufacturer === 'All' || (p.manufacturing?.manufacturer === selectedManufacturer);

                let matchesQuery = query === '' || (
                    p.id.toLowerCase().includes(query) ||
                    p.name.toLowerCase().includes(query) ||
                    (p.manufacturing?.manufacturer || '').toLowerCase().includes(query) ||
                    p.categoryPath.toLowerCase().includes(query) ||
                    (p.lexNotes?.lexNote || '').toLowerCase().includes(query)
                );

                return matchesUniverse && matchesMain && matchesSub && matchesManufacturer && matchesQuery;
            });

            renderTree(filtered);
        }

        function renderTree(parts) {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';

            document.getElementById('stat-count').innerText = parts.length;

            if (parts.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:20px;">Ingen poster funnet under denne kategorien.</p>`;
                return;
            }

            let categories = {};
            parts.forEach(part => {
                let cat = part.categoryPath || "Unsorted";
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(part);
            });

            for (let cat in categories) {
                let folderId = 'folder-' + Math.random().toString(36).substr(2, 9);
                let folderHTML = `
                    <div class="category-folder">
                        <div class="folder-header" onclick="toggleFolder('${folderId}')">
                            <span>◈ ${cat}</span>
                            <span>[${categories[cat].length} items] ▼</span>
                        </div>
                        <div class="folder-content" id="${folderId}">
                `;

                categories[cat].forEach(part => {
                    let isClassified = part.universeStatus === 'Classified';
                    let rowClass = isClassified ? 'item-row classified' : 'item-row';
                    let badgeClass = isClassified ? 'universe-badge classified' : 'universe-badge';
                    let dupTag = part.isDuplicate ? `<span style="color: var(--status-red); font-size: 0.75rem; border: 1px solid var(--status-red); padding: 1px 4px; margin-left: 6px;">⚠️ DUPLIKAT</span>` : '';
                    
                    let partJson = encodeURIComponent(JSON.stringify(part));

                    folderHTML += `
                        <div class="${rowClass}">
                            <div class="item-info" onclick="openModal('${partJson}')">
                                <span>[${part.id}]</span> <strong>${part.name}</strong> ${dupTag}
                                <div style="font-size:0.8rem; color:var(--text-muted); margin-top: 3px;">Affiliation/Mfr: ${part.manufacturing?.manufacturer || 'Unknown'} | Note: ${part.lexNotes?.lexNote || ''}</div>
                            </div>
                            <span class="${badgeClass}" onclick="openModal('${partJson}')">${part.universeStatus}</span>
                        </div>
                    `;
                });

                folderHTML += `</div></div>`;
                container.innerHTML += folderHTML;
            }
        }

        function toggleFolder(id) {
            document.getElementById(id).classList.toggle('open');
        }
		function openModal(partJson) {
            activeModalPart = JSON.parse(decodeURIComponent(partJson));
            
            document.getElementById('modal-id').innerText = `Record ID: ${activeModalPart.id}`;
            document.getElementById('modal-name').innerText = activeModalPart.name;
            document.getElementById('modal-universe').innerText = `Universe Status: ${activeModalPart.universeStatus}`;
            
            // Sjekk om det finnes et bilde, og lag miniatyrbildet hvis det gjør det

        // AUTOMATISK ID-GENERATOR MED 5-SIFRER OG UNIVERS-BOKSTAV
       // NY OG RENERE ID-GENERATOR
        // NY OG RENERE ID-GENERATOR
        function generateAutoID(mainCat, universeStr) {
            let uChar = 'C';
            if (universeStr === 'Legends') uChar = 'L';
            if (universeStr === 'Fan-Made' || universeStr === 'Fanmade') uChar = 'FM';

            // Velg en pen kode basert på hovedkategori
            let catCode = "SYS";
            let mainLower = mainCat.toLowerCase();
            if (mainLower.includes("weapon")) catCode = "WPN";
            else if (mainLower.includes("armor")) catCode = "ARM";
            else if (mainLower.includes("clothing")) catCode = "CLO";
            else if (mainLower.includes("material") || mainLower.includes("agriculture")) catCode = "MAT";
            else if (mainLower.includes("food")) catCode = "FOD";
            else if (mainLower.includes("starship")) catCode = "SHIP";
            else if (mainLower.includes("speeder")) catCode = "SPD";
            else if (mainLower.includes("medical")) catCode = "MED";
            else if (mainLower.includes("survival") || mainLower.includes("tools")) catCode = "GEAR";
            else if (mainLower.includes("software") || mainLower.includes("droids")) catCode = "SYS";
            else if (mainLower.includes("associate") || mainLower.includes("shadow")) catCode = "PERS";

            let searchPrefix = `${catCode}-`;
            let maxNum = 0;

            catalogData.components.forEach(item => {
                if (item.id && item.id.startsWith(searchPrefix)) {
                    let parts = item.id.split('-');
                    for (let p of parts) {
                        let num = parseInt(p, 10);
                        if (!isNaN(num) && num > maxNum && num < 99999) {
                            maxNum = num;
                        }
                    }
                }
            });

            let nextNum = maxNum + 1;
            let paddedNum = String(nextNum).padStart(5, '0');
            return `${catCode}-${paddedNum}-${uChar}`;
        }

		async function loadCatalogFromGitHub() {
            const jsonUrl = 'https://raw.githubusercontent.com/LexRonny/Lex-Spare-Part-Catalog/feature-json-update/catalogData_backup%20(1).json';

            try {
                let response = await fetch(jsonUrl);
                if (!response.ok) {
                    throw new Error(`HTTP-feil! Status: ${response.status}`);
                }
                
                let data = await response.json();
                
                if (data && data.components) {
                    catalogData = data;
                    initCatalog();
                    console.log("Katalog lastet vellykket fra GitHub!");
                }
            } catch (error) {
                console.error("Kunne ikke hente katalog fra GitHub, bruker lokal lagring:", error);
                initCatalog();
            }
        }
